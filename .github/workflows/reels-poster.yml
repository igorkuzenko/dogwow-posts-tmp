# DogWOW Reels-Kampagne (Batch 1+): postet IG (FB fuer Batch 1 via Business Suite geplant).
# Slots Berlin CEST: 12:00 (a, 10:00 UTC) / 18:00 (b, 16:00 UTC) / 00:00 (c, 22:00 UTC Vortag).
name: DogWOW Reels-Poster
on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 16 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot (a, b, c, any, auto)'
        default: 'auto'
permissions:
  contents: write
concurrency:
  group: reels-poster
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Post next due reel
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python3 automation-reels/publisher.py --run --slot "${{ github.event.inputs.slot || 'auto' }}"
      - name: Persist state
        run: |
          git config user.name "poster-bot"
          git config user.email "poster-bot@users.noreply.github.com"
          git pull --rebase
          git add automation-reels/state.json
          git commit -m "state: reels advance [skip ci]" || echo "no state change"
          git push
